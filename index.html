<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Novedades - Slider Simple</title>
  </head>

  <body>
    <div id="slides-container"></div>

    <script>
      const BACKEND_URL = "https://back-slider.onrender.com";

      // ===============================
      // Carga inicial de videos
      // ===============================
      async function loadSlides() {
        try {
          const res = await fetch(`${BACKEND_URL}/traer/slider`, {
            cache: "no-store",
          });

          const videos = await res.json();
          const container = document.querySelector("#slides-container");

          container.innerHTML = "";

          videos.forEach((video, index) => {
            const slide = document.createElement("div");
            slide.className = "slide" + (index === 0 ? " active" : "");

            slide.innerHTML = `
              <video 
                src="${video.url}"
                playsinline
                muted
                preload="metadata"
              ></video>
            `;

            container.appendChild(slide);
          });

          startSimpleSlider();
        } catch (err) {
          console.error("Error cargando videos:", err);
        }
      }

      // ===============================
      // Slider simple en loop
      // ===============================
      function startSimpleSlider() {
        const slides = Array.from(document.querySelectorAll(".slide"));
        if (slides.length === 0) return;

        let current = 0;

        function playCurrent() {
          const slide = slides[current];
          const video = slide.querySelector("video");

          slide.classList.add("active");
          video.currentTime = 0;

          video.play().catch(() => {});

          video.onended = () => {
            slide.classList.remove("active");
            current = (current + 1) % slides.length;
            playCurrent();
          };
        }

        playCurrent();
      }

      // ===============================
      // Latido para que Render no duerma
      // ===============================
      async function keepBackendAwake() {
        try {
          await fetch(`${BACKEND_URL}/health`, {
            cache: "no-store",
          });
        } catch (_) {
          // Silencio elegante: si falla, no rompemos nada
        }
      }

      // ===============================
      // Inicio
      // ===============================
      loadSlides();

      // Cada 5 minutos mantenemos vivo el backend
      setInterval(keepBackendAwake, 5 * 60 * 1000);
    </script>
  </body>
</html>
